# Render Blueprint Configuration for SIH-Hardware
services:
  - type: web
    name: spectraguard
    env: python
    region: oregon
    plan: free
    rootDir: spectraguard
    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/requirements.txt pillow reportlab
      python -m backend.inference.train_demo_model
      python -m backend.records.seed
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "true"
      - key: PYTHONPATH
        value: /opt/render/project/src/spectraguard
